<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="js/main.js" type="module"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>

    <main class="divider">
      <!-- the alert messages from "json/alerts.json" are added here by "js/Alert.js"  for MOTD and such -->
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="/images/banner-sm.jpg 500w, /images/banner.jpg"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <!-- each category is a links to the product listing page with the
         category in the "?category=" URL parameter -->
      <section class="categories">
        <h2>Shop by Category</h2>
        <ul class="category-list">
          <li>
            <a href="product_listing/index.html?category=tents">
              <img src="/images/products/category-tents.svg" alt="" />
              <span>Tents</span>
            </a>
          </li>
          <li>
            <a href="product_listing/index.html?category=backpacks">
              <img src="/images/products/category-backpacks.svg" alt="" />
              <span>Backpacks</span>
            </a>
          </li>
          <li>
            <a href="product_listing/index.html?category=sleeping-bags">
              <img src="/images/products/category-sleepingbags.svg" alt="" />
              <span>Sleeping Bags</span>
            </a>
          </li>
          <li>
            <a href="product_listing/index.html?category=hammocks">
              <img src="/images/products/category-hammocks.svg" alt="" />
              <span>Hammocks</span>
            </a>
          </li>
        </ul>
      </section>

      <section class="newsletter" aria-labelledby="newsletter-title">
        <h2 id="newsletter-title">Get Outside with Us</h2>
        <p>
          Sign up for our newsletter to hear about new gear and outdoor
          inspiration.
        </p>
        <form id="newsletter-form">
          <label for="newsletter-email">Email address</label>
          <div class="newsletter-form__controls">
            <input
              id="newsletter-email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
            <button type="submit">Sign Up</button>
          </div>
          <p
            id="newsletter-message"
            class="newsletter-message"
            aria-live="polite"
          ></p>
        </form>
      </section>
    </main>

    <footer id="dfooter"></footer>
  </body>
</html>
