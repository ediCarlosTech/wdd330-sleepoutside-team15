<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Home</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="js/main.js" type="module"></script>
</head>

<body>
  <header id="main-header" class="divider"></header>
  <main class="divider">
    <section class="alert-list">
      <!-- This is being loaded dynamically -->
      <!-- <p style="background-color: darkblue; color: white">
        This is a sample alert message.
      </p> -->
    </section>

    <main class="divider">
      <div class="hero">
        <img src="/images/banner-sm.jpg" srcset="/images/banner-sm.jpg 500w, /images/banner.jpg"
          alt="image of a high mountain lake" />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section class="products">
        <h2>Top Products</h2>

        <label for="sort-products">Sort by:</label>

        <select id="sort-products">
          <option value="default">Default</option>
          <option value="name-asc">Name: A to Z</option>
          <option value="name-desc">Name: Z to A</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
        </select>

        <!-- the product cards are built by "js/ProductList.mjs" from
             "json/tents.json"; each card links to the single product page
             with the product ID in the "?product=" URL parameter -->
        <ul class="product-list"></ul>
      </section>
    </main>
    <footer id="dfooter"></footer>
  </main>
</body>

</html>
