<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h1>Review & Place your Order</h1>

        <form id="checkoutForm">

          <!-- CUSTOMER INFORMATION-->

          <fieldset>
            <legend>Customer Information</legend>
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" autocomplete="given-name" required>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" autocomplete="family-name" required>
          </fieldset>

          <!-- SHIPPING ADDRESS-->

           <fieldset>
            <legend>Shipping Address</legend>

            <label for="street">Street Address:</label>
            <input type="text" id="street" name="street" autocomplete="street-address" required>

            <label for="city">City:</label>
            <input type="text" id="city" name="city" autocomplete="address-level2" required>

            <label for="state">State:</label>
            <!-- "pattern" checks the format, and "title" is shown in the
                 browser's message when the format is wrong -->
            <input type="text" id="state" name="state" autocomplete="address-level1"
              placeholder="ID" maxlength="2" pattern="[A-Za-z]{2}"
              title="The 2-letter state code, for example ID" required>

            <label for="zip">Zip Code:</label>
            <input type="text" id="zip" name="zip" autocomplete="postal-code"
              inputmode="numeric" placeholder="83440" maxlength="5" pattern="\d{5}"
              title="A 5-digit zip code" required>
           </fieldset>

           <!-- PAYMENT INFORMATION-->
           <fieldset>
            <legend>Payment Information</legend>

            <label for="cardNumber">Credit Card Number:</label>
            <input type="text" id="cardNumber" name="cardNumber" autocomplete="cc-number"
              inputmode="numeric" maxlength="16" pattern="\d{16}"
              title="The 16-digit card number, with no spaces" required>

            <label for="expiration">Expiration Date:</label>
            <input type="text" id="expiration" name="expiration" placeholder="MM/YY" autocomplete="cc-exp"
              maxlength="5" pattern="(0?[1-9]|1[0-2])/\d{2}"
              title="The month and year, for example 08/30" required>

            <label for="code">Security Code:</label>
            <input type="text" id="code" name="code" inputmode="numeric" autocomplete="cc-csc"
              maxlength="3" pattern="\d{3}"
              title="The 3-digit code on the back of the card" required>
           </fieldset>

           <!-- ORDER SUMMARY-->

           <section id="order-summary">
            <h2>Order Summary</h2>
      
            <p>
              Subtotal:
            <span id="subtotal">$0.00</span> 
            </p>

            <p>
              Tax:
            <span id="tax">$0.00</span> 
            </p>

            <p>
              Shipping Estimate:
            <span id="shipping">$0.00</span> 
            </p>

            <p>
              Order Total:
            <span id="orderTotal">$0.00</span> 
            </p>

          </section>

           <!-- Checkout button-->

           <button id="checkoutSubmit" type="submit">Checkout</button>

        </form>

      </section>
    </main>

    <footer id="dfooter"></footer>
  </body>
</html>
