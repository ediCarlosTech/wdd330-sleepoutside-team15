<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Checkout</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="../js/checkout.js" type="module"></script>
</head>

<body>
  <header class="divider" id="main-header"></header>
  <div id="bread"></div>
  <main class="divider">
    <section class="products">
      <h1>Review & Place your Order</h1>

      <form id="checkoutForm">
        <!-- CUSTOMER INFORMATION-->

        <fieldset class="checkout-form">
          <legend>Customer Information</legend>
          <label for="fname">First Name:
            <input type="text" id="fname" name="fname" autocomplete="given-name" required />
          </label>

          <label for="lname">Last Name:
            <input type="text" id="lname" name="lname" autocomplete="family-name" required />
          </label>
        </fieldset>

        <!-- SHIPPING ADDRESS-->

        <fieldset class="checkout-form">
          <legend>Shipping Address</legend>

          <label for="street">Street Address:
            <input type="text" id="street" name="street" autocomplete="street-address" required />

          </label>

          <label for="city">City:
            <input type="text" id="city" name="city" autocomplete="address-level2" required />

          </label>

          <label for="state">State:
            <input type="text" id="state" name="state" autocomplete="address-level1" required />
            
          </label>

          <label for="zip">Zip Code:
            <input type="text" id="zip" name="zip" autocomplete="postal-code" required />

          </label>
        </fieldset>

        <!-- PAYMENT INFORMATION-->
        <fieldset class="checkout-form">
          <legend>Payment Information</legend>

          <label for="cardNumber">Credit Card Number:
            <input type="text" id="cardNumber" name="cardNumber" autocomplete="cc-number" required />

          </label>

          <label for="expiration">Expiration Date:
            <input type="text" id="expiration" name="expiration" placeholder="MM/YY" autocomplete="cc-exp" required />

          </label>

          <label for="code">Security Code:

            <input type="text" id="code" name="code" inputmode="numeric" autocomplete="cc-csc" required />
          </label>
        </fieldset>

        <!-- ORDER SUMMARY-->

        <section id="order-summary">
          <h2>Order Summary</h2>

          <p>
            Subtotal:
            <span id="subtotal">$0.00</span>
          </p>

          <p>
            Tax:
            <span id="tax">$0.00</span>
          </p>

          <p>
            Shipping Estimate:
            <span id="shipping">$0.00</span>
          </p>

          <p>
            Order Total:
            <span id="orderTotal">$0.00</span>
          </p>
        </section>

        <!-- Checkout button-->

        <button id="checkoutSubmit" type="submit">Checkout</button>
      </form>
    </section>
  </main>

  <footer id="dfooter"></footer>
</body>

</html>
