<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Cart</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="../js/cart.js" type="module"></script>
</head>

<body>
  <header class="divider" id="main-header"></header>
  <main class="divider">
    <section class="products">
      <h2>My Cart</h2>
      <!-- the cart items are built by "js/cart.js" from the cart in
             local storage ("so-cart") using cartItemTemplate() -->
      <ul class="product-list"></ul>

      <!-- cart footer: hidden by default with the "hide" class and shown by
             cart.js when the cart has items. It will also hold the Checkout
             button when that is added. -->
      <div class="cart-footer hide">
        <p class="cart-total">Total:</p>
      </div>
    </section>
  </main>

  <footer id="dfooter"></footer>
</body>

</html>
