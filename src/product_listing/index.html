<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Products</title>
    <link rel="stylesheet" href="/css/style.css" />
    <!-- this page is one folder down, so the script path starts with "../" -->
    <script src="../js/product-listingjb.js" type="module"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>

    <main class="divider">
      <section class="products">
        <h2></h2>

        <label for="sort-products">Sort by:</label>

        <select id="sort-products">
          <option value="default">Default</option>
          <option value="name-asc">Name: A to Z</option>
          <option value="name-desc">Name: Z to A</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
        </select>

        <!-- the product cards are built by "js/ProductList.mjs"; each card links
           to the single product page with the product ID in the "?product=" URL parameter -->
        <ul class="product-list"></ul>
      </section>

      <!-- the quick view pop-up is filled in and controlled by "js/QuickView.mjs";
           role="dialog" and aria-labelledby let screen readers announce it -->
      <div
        id="quick-view-modal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="quick-view-name"
      >
        <div class="modal-content">
          <button
            id="close-modal"
            class="close-modal"
            type="button"
            aria-label="Close quick view"
          >
            &times;
          </button>

          <img id="quick-view-image" src="" alt="" />

          <h3 id="quick-view-brand"></h3>
          <h2 id="quick-view-name"></h2>
          <p id="quick-view-price"></p>
          <p id="quick-view-color"></p>
          <div id="quick-view-description"></div>

          <button id="quick-view-add" class="quick-view__add" type="button">
            Add to Cart
          </button>
          <!-- role="status" is a live region: "added to your cart" is announced -->
          <p
            id="quick-view-status"
            class="quick-view__status"
            role="status"
          ></p>
        </div>
      </div>
    </main>

    <footer id="dfooter"></footer>
  </body>
</html>
