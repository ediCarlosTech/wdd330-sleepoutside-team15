<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- the title is updated with the product name by ProductDetails.mjs -->
    <title>Sleep Outside | Product Details</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/product.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <div id="bread"></div>
    <main class="divider">
      <!-- one page for every product: the details are filled in by
           ProductDetails.mjs using the "?product=" ID in the URL -->
      <section class="product-detail">
        <!-- brand name, from "Brand.Name" -->
        <h3 id="productBrand"></h3>

        <!-- product name, from "NameWithoutBrand" -->
        <h2 id="productName" class="divider"></h2>

        <!-- product image - responsive-->
        <div id="prod-image"></div>

        <!-- price, from "FinalPrice" -->
        <p id="productPrice" class="product-card__price"></p>

        <!-- Available product colors -->
        <div class="product__colors">
          <p>Available Colors:</p>
          <div id="productColor" class="color-options"></div>
        </div>

        <!-- description, from "DescriptionHtmlSimple" -->
        <p id="productDesc" class="product__description"></p>

        <div class="product-detail__add">
          <!-- "data-id" is set to the product ID when the product loads -->
          <button id="addToCart">Add to Cart</button>

          <!-- Add or remove the product from the wishlist -->
          <button id="addToWishlist" type="button">♡ Add to Wishlist</button>
        </div>
      </section>
      <section class="comments-section" aria-label="Product Comments">
        
        <form id="commentForm" class="comment-form">
          <h3>Review this product</h3>
          <div class="form-group">
            <label for="commentUser">Name</label>
            <input type="text" id="commentUser" name="user" placeholder="Your name" required />
          </div>
      
          <div class="form-group">
            <label for="commentText">Comment</label>
            <textarea id="commentText" name="comment" rows="3" placeholder="Share your thoughts on this product..." required></textarea>
          </div>
      
          <button type="submit" id="submitComment">Post Comment</button>
        </form>

      <h3 class="reviews">Product Reviews</h3>
        <ul id="commentList" class="comment-list"></ul>
      </section>
    </main>

    <footer id="dfooter"></footer>
  </body>
</html>
